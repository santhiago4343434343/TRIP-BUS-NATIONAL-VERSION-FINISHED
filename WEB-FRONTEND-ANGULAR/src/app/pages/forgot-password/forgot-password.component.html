<section class="auth-bg min-h-screen flex items-start justify-center px-4 py-16">
  <div class="auth-card w-full max-w-lg p-8 md:p-10 rounded-2xl shadow-2xl">
    <div class="flex items-center gap-4 mb-8">
      <i class="fa-solid fa-lock text-6xl text-yellow-400"></i>
      <div>
        <h2 class="text-3xl font-black uppercase tracking-tighter text-white">Forgot Password</h2>
        <p class="text-yellow-300 font-semibold">We'll send you a reset link</p>
      </div>
    </div>
    <form (ngSubmit)="submit()" #f="ngForm" class="flex flex-col gap-4">
      <div class="field-item">
        <label for="email" class="field-label">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" required email placeholder="you@email.com" class="field-input" />
      </div>
      <p *ngIf="successMessage" class="msg-success">{{ successMessage }}</p>
      <p *ngIf="errorMessage" class="msg-error">{{ errorMessage }}</p>
      <button type="submit" class="btn-auth" [disabled]="f.invalid || isLoading">
        {{ isLoading ? 'SENDING...' : 'SEND RESET LINK' }}
      </button>
    </form>
    <p class="text-center text-white/80 mt-6 font-semibold">
      Remembered your password?
      <a routerLink="/login" class="text-yellow-300 hover:underline">Sign in here</a>
    </p>
  </div>
</section>
