<section class="auth-bg min-h-screen flex items-start justify-center px-4 py-16">
  <div class="auth-card w-full max-w-lg p-8 md:p-10 rounded-2xl shadow-2xl">
    <div class="flex items-center gap-4 mb-8">
      <i class="fa-solid fa-key text-6xl text-yellow-400"></i>
      <div>
        <h2 class="text-3xl font-black uppercase tracking-tighter text-white">New Password</h2>
        <p class="text-yellow-300 font-semibold">Choose a strong password</p>
      </div>
    </div>
    <form (ngSubmit)="submit()" #f="ngForm" class="flex flex-col gap-4">
      <div class="field-item">
        <label for="password" class="field-label">New Password</label>
        <div class="relative">
          <input id="password" [type]="mostrarSenha ? 'text' : 'password'" name="password" [(ngModel)]="password" required minlength="6" placeholder="At least 6 characters" class="field-input" style="padding-right: 3rem;" />
          <button type="button" (click)="mostrarSenha = !mostrarSenha" [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'" class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 hover:text-slate-700">
            <svg *ngIf="!mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.036 12.322a1 1 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg><svg *ngIf="mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2.5 3.4 6 5.2 9 5.2s6.5-1.8 9-5.2 M6 13.6l-1.2 2.2 M12 15.2v2.4 M18 13.6l1.2 2.2" /></svg>
          </button>
        </div>
      </div>
      <div class="field-item">
        <label for="confirmPassword" class="field-label">Confirm Password</label>
        <div class="relative">
          <input id="confirmPassword" [type]="mostrarSenha ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="Repeat your password" class="field-input" style="padding-right: 3rem;" />
          <button type="button" (click)="mostrarSenha = !mostrarSenha" [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'" class="absolute inset-y-0 right-0 flex items-center px-4 text-slate-500 hover:text-slate-700">
            <svg *ngIf="!mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.036 12.322a1 1 0 010-.644C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .644C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg><svg *ngIf="mostrarSenha" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c2.5 3.4 6 5.2 9 5.2s6.5-1.8 9-5.2 M6 13.6l-1.2 2.2 M12 15.2v2.4 M18 13.6l1.2 2.2" /></svg>
          </button>
        </div>
      </div>
      <p *ngIf="successMessage" class="msg-success">{{ successMessage }}</p>
      <p *ngIf="errorMessage" class="msg-error">{{ errorMessage }}</p>
      <button type="submit" class="btn-auth" [disabled]="f.invalid || isLoading || !token">
        {{ isLoading ? 'SAVING...' : 'SET NEW PASSWORD' }}
      </button>
    </form>
    <p class="text-center text-white/80 mt-6 font-semibold">
      <a routerLink="/login" class="text-yellow-300 hover:underline">← Back to Sign In</a>
    </p>
  </div>
</section>
