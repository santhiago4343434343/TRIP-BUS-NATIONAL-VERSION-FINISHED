<div class="min-h-screen bg-cover bg-center bg-fixed w-full"
  style="background-image: linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('assets/fundo-praia.png');">

  <app-header></app-header>

  <main class="container mx-auto py-8">
    <router-outlet></router-outlet>
  </main>

  <!-- Botão Flutuante do WhatsApp -->
  <button (click)="direcionarParaWhatsapp()"
    class="fixed bottom-32 right-6 z-50 bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 hover:bg-[#128C7E] transition-all duration-300 group shadow-green-500/20"
    aria-label="Falar no WhatsApp">

    <!-- Ícone do FontAwesome -->
    <i class="fa-brands fa-whatsapp text-3xl"></i>

    <!-- Tooltip que aparece no hover -->
    <span
      class="absolute right-16 bg-white text-gray-800 text-xs font-bold px-3 py-2 rounded-lg shadow-md opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
      Como podemos ajudar?
    </span>

  </button>
  <app-cookie-banner></app-cookie-banner>

  <app-footer></app-footer>

</div>
