default: &default
  adapter: mysql2
  encoding: utf8mb4
  host:     <%= ENV.fetch("DB_HOST")     { "db" } %>
  port:     <%= ENV.fetch("DB_PORT")     { 3306 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "tripuser" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "trippass" } %>
  pool:     <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: trip_bus_db

test:
  <<: *default
  database: trip_bus_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "trip_bus_db" } %>